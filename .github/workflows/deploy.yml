name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master

# Mengatur izin GITHUB_TOKEN untuk deployment ke GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build React App (dengan menyisipkan Repo Secrets)
        run: npm run build
        env:
          VITE_FONNTE_TOKEN: ${{ secrets.VITE_FONNTE_TOKEN }}
          VITE_WA_GROUP_TARGET_ID: ${{ secrets.VITE_WA_GROUP_TARGET_ID }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}

      # Agar routing client-side (React Router) berjalan lancar saat di-refresh 
      # di GitHub Pages, kita gandakan index.html sebagai 404.html
      - name: Fallback untuk SPA Routing 404
        run: cp dist/index.html dist/404.html

      - name: Setup Pages Configuration
        uses: actions/configure-pages@v4

      - name: Upload Static Assets
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
